name: CI

on:
  push:
    branches: [main,master,develop]
  pull_request:
    branches: [main,master,develop]

jobs:
  backend:
    name: Backend — ruff / mypy / pytest
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-secret-minimo-32-caracteres-para-tests!!
      DATABASE_URL: sqlite:///nexus.db

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff — lint
        run: ruff check .

      - name: Ruff — formato (check)
        run: ruff format --check .

      - name: Mypy — tipado
        run: mypy app --ignore-missing-imports

      - name: Alembic — migraciones
        run: alembic upgrade head

      - name: Pytest
        run: pytest -v --cov=app --cov-report=term-missing

  frontend:
    name: Frontend — vitest / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests (Vitest)
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000
