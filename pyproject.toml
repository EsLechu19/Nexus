[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
# Compatibilidad ruff 0.9 y 0.14+ — ignora isort/RUF/FURB en tests/alembic donde son ruido
[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F401", "E402", "I001"]
"tests/**" = ["F401", "RUF100", "RUF015", "S101", "PLR2004", "ANN", "E501", "RUF021", "I001", "FURB157"]
"alembic/versions/**" = ["E501", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
